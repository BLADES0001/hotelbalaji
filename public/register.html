<!DOCTYPE html>
<html>

<head>

<title>Restaurant Registration</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:450px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:25px;
}

input,
select{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#d39b1a;
color:white;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#deliveryChargeBox{
display:none;
}

.note{
margin-top:15px;
font-size:14px;
color:#666;
text-align:center;
}

</style>

</head>

<body>

<div class="container">

<h1>Restaurant Registration</h1>

<input
id="hotelName"
placeholder="Restaurant Name">

<input
id="ownerName"
placeholder="Owner Name">

<input
id="mobile"
placeholder="Phone Number">

<input
id="address"
placeholder="Restaurant Address">

<input
id="city"
placeholder="City">

<input
id="pincode"
placeholder="Pincode">

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<input
id="deliveryRange"
type="number"
placeholder="Delivery Range (KM)">

<select
id="deliveryType"
onchange="toggleDeliveryCharge()">

<option value="free">
Free Delivery
</option>

<option value="custom">
Custom Delivery Charge
</option>

</select>

<div id="deliveryChargeBox">

<input
id="deliveryCharge"
type="number"
placeholder="Delivery Charge">

</div>

<button onclick="registerRestaurant()">
Register Restaurant
</button>

<div class="note">

Subscription:
₹99/month

</div>

</div>

<script>

function toggleDeliveryCharge(){

const type =
document.getElementById(
'deliveryType'
).value;

document.getElementById(
'deliveryChargeBox'
).style.display =

type === "custom"
? "block"
: "none";

}

async function registerRestaurant(){

const data = {

hotelName:
document.getElementById(
'hotelName'
).value,

ownerName:
document.getElementById(
'ownerName'
).value,

mobile:
document.getElementById(
'mobile'
).value,

address:
document.getElementById(
'address'
).value,

city:
document.getElementById(
'city'
).value,

pincode:
document.getElementById(
'pincode'
).value,

username:
document.getElementById(
'username'
).value,

password:
document.getElementById(
'password'
).value,

deliveryRange:Number(
document.getElementById(
'deliveryRange'
).value
),

deliveryType:
document.getElementById(
'deliveryType'
).value,

deliveryCharge:Number(
document.getElementById(
'deliveryCharge'
).value || 0
)

};

const res = await fetch(
'/register-restaurant',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(data)
}
);

const text = await res.text();

if(
text.includes("already")
){

alert(
"Restaurant already registered.\nPlease use different hotel name, username or mobile number."
);

}else{

alert(
"Registration submitted successfully.\nWaiting for owner approval."
);

window.location.reload();

}

}

</script>

</body>
</html>
