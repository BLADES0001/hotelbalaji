<!DOCTYPE html>
<html>

<head>

<title>Restaurant Registration</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
background:#f5f5f5;
margin:0;
padding:20px;
}

.container{
max-width:450px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:25px;
}

input,
select{
width:100%;
padding:14px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
background:#d39b1a;
color:white;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#deliveryChargeBox{
display:none;
}

.note{
margin-top:15px;
font-size:14px;
color:#666;
text-align:center;
}
.map-picker{background:linear-gradient(135deg,#d8ead0,#b9d6e8);border:2px solid #9db9a3;border-radius:14px;cursor:crosshair;height:210px;margin-bottom:15px;position:relative}
.map-marker{background:#d94b62;border:3px solid white;border-radius:50%;height:16px;position:absolute;transform:translate(-50%,-50%);width:16px}

</style>

</head>

<body>

<div class="container">

<h1>Restaurant Registration</h1>

<input
id="hotelName"
placeholder="Restaurant Name">

<input
id="ownerName"
placeholder="Owner Name">

<input
id="mobile"
placeholder="Phone Number">

<input
id="address"
placeholder="Restaurant Address">

<input
id="city"
placeholder="City">

<input
id="pincode"
placeholder="Pincode">

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<input
id="deliveryRange"
type="number"
placeholder="Delivery Range (KM)">

<p>Choose approximate restaurant location on map:</p>
<div id="restaurantMap" class="map-picker" onclick="pickRestaurantLocation(event)">
<b id="restaurantMarker" class="map-marker" hidden></b>
</div>
<input id="latitude" type="number" step="any" placeholder="Latitude" readonly>
<input id="longitude" type="number" step="any" placeholder="Longitude" readonly>

<select
id="deliveryType"
onchange="toggleDeliveryCharge()">

<option value="free">
Free Delivery
</option>

<option value="custom">
Custom Delivery Charge
</option>

</select>

<div id="deliveryChargeBox">

<input
id="deliveryCharge"
type="number"
placeholder="Delivery Charge">

</div>

<button onclick="registerRestaurant()">
Register Restaurant
</button>

<div class="note">

Subscription:
₹99/month

</div>

</div>

<script>

function toggleDeliveryCharge(){

const type =
document.getElementById(
'deliveryType'
).value;

document.getElementById(
'deliveryChargeBox'
).style.display =

type === "custom"
? "block"
: "none";

}

async function registerRestaurant(){

const data = {

hotelName:
document.getElementById(
'hotelName'
).value,

ownerName:
document.getElementById(
'ownerName'
).value,

mobile:
document.getElementById(
'mobile'
).value,

address:
document.getElementById(
'address'
).value,

city:
document.getElementById(
'city'
).value,

pincode:
document.getElementById(
'pincode'
).value,

username:
document.getElementById(
'username'
).value,

password:
document.getElementById(
'password'
).value,

deliveryRange:Number(
document.getElementById(
'deliveryRange'
).value
),

deliveryType:
document.getElementById(
'deliveryType'
).value,

deliveryCharge:Number(
document.getElementById(
'deliveryCharge'
).value || 0
),

latitude:Number(document.getElementById('latitude').value),

longitude:Number(document.getElementById('longitude').value)

};

const res = await fetch(
'/register-restaurant',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify(data)
}
);

const text = await res.text();

if(
text.includes("already")
){

alert(
"Restaurant already registered.\nPlease use different hotel name, username or mobile number."
);

}else{

alert(
"Registration submitted successfully.\nWaiting for owner approval."
);

window.location.reload();

}

}

function pickRestaurantLocation(event){
const rect=event.currentTarget.getBoundingClientRect();
const x=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
const y=Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height));
document.getElementById('latitude').value=(8+(1-y)*29).toFixed(6);
document.getElementById('longitude').value=(68+x*29).toFixed(6);
const marker=document.getElementById('restaurantMarker');
marker.hidden=false;
marker.style.left=(x*100)+'%';
marker.style.top=(y*100)+'%';
}

</script>

</body>
</html>
